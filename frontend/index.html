<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- ===================================
         PRIMARY META TAGS
         =================================== -->
    <title>JanVoice - National Public Complaint & Action Platform</title>
    <meta
      name="description"
      content="JanVoice — National Public Complaint & Action Platform. Report civic issues, track resolutions in real-time, and build a better India together."
    />
    <meta
      name="keywords"
      content="JanVoice, complaint, government, India, civic issues, public grievance, government platform, citizen portal"
    />
    <meta name="author" content="Ministry of Housing & Urban Affairs, Government of India" />
    <meta name="theme-color" content="#FF6B35" />

    <!-- ===================================
         FAVICON
         =================================== -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- ===================================
         OPEN GRAPH
         =================================== -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="JanVoice - National Public Complaint & Action Platform" />
    <meta
      property="og:description"
      content="Your Voice, Our Action. Report civic issues, track resolutions, and build a better India together."
    />
    <meta property="og:site_name" content="JanVoice" />

    <!-- ===================================
         TWITTER CARD
         =================================== -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JanVoice" />
    <meta
      name="twitter:description"
      content="Your Voice, Our Action. Report civic issues, track resolutions."
    />

    <!-- ===================================
         SEO
         =================================== -->
    <meta name="robots" content="index, follow" />

    <!-- ===================================
         GOOGLE ANALYTICS (GA4)
         =================================== -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-YEFLMQWLT1"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());

      gtag('config', 'G-YEFLMQWLT1', {
        anonymize_ip: true
      });
    </script>

    <!-- ===================================
         ✅ PRE-RENDER THEME (prevents flash of light theme)
         =================================== -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('janvoice_theme');
          if (!theme) {
            var prefs = localStorage.getItem('janvoice_preferences');
            if (prefs) {
              try { theme = JSON.parse(prefs).theme; } catch (e) { theme = 'light'; }
            }
          }
          if (theme === 'dark') {
            document.documentElement.classList.add('dark-mode');
          } else if (theme === 'auto' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark-mode');
          }
        } catch (e) {
          // fail silently
        }
      })();
    </script>

    <!-- ===================================
         INLINE CRITICAL CSS
         =================================== -->
    <style>
      html {
        background-color: #f5f7fa;
      }

      html.dark-mode {
        background-color: #1a202c;
      }

      body {
        margin: 0;
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Roboto',
          'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans',
          'Helvetica Neue', sans-serif;
      }

      #root {
        min-height: 100vh;
      }

      .app-loader {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #f5f7fa 0%, #ffffff 100%);
      }

      html.dark-mode .app-loader {
        background: linear-gradient(135deg, #1a202c 0%, #2d3748 100%);
      }

      .app-loader-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid #e2e8f0;
        border-top-color: #ff6b35;
        border-radius: 50%;
        animation: app-spin 0.8s linear infinite;
      }

      html.dark-mode .app-loader-spinner {
        border-color: #4a5568;
        border-top-color: #ff6b35;
      }

      @keyframes app-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <noscript>
      <div
        style="
          padding: 40px;
          text-align: center;
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
          background: #f5f7fa;
          color: #1a202c;
        "
      >
        <h1 style="color: #ff6b35; font-size: 28px; margin-bottom: 16px">
          🇮🇳 JanVoice
        </h1>
        <p style="font-size: 16px; line-height: 1.6; max-width: 500px; margin: 0 auto 20px">
          JanVoice requires JavaScript. Please enable it and reload.
        </p>
      </div>
    </noscript>

    <div id="root">
      <div class="app-loader">
        <div class="app-loader-spinner"></div>
      </div>
    </div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
